name: CI

on:
  push:
    branches: [main]
  pull_request:
  # RISU は uxsim の内部 API に依存した高速化を持つ（CLAUDE.md §3.6）．
  # requirements.txt は `uxsim>=1.11.0,<2` なので，新しい uxsim が出ると
  # 黙って壊れ得る．push が無くても週 1 で気づけるようにしておく．
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 00:00 UTC
  workflow_dispatch:       # 手動実行

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # push / pull_request は requirements.lock.txt に固定して走る（再現性．Python 3.12 のジョブのみ）．
  # 週次の schedule と手動実行は制約なしで最新版を入れ，新しい uxsim / starlette で壊れないかを見る．
  # 2 段構えにすると「自分の変更で壊れた」と「依存が動いて壊れた」を切り分けられる．
  LOCK_ARGS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--upgrade' || '-c requirements.lock.txt' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # lint だけなら重い依存（osmnx → geopandas/shapely）は要らない
      - run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .
      # NOTE: `ruff format` は意図的に CI へ入れていない．
      # risu/simulation.py などの数値処理は桁を揃えて書いてあり，自動整形すると
      # 数千行規模の差分が出て履歴が読めなくなるため．入れるならモジュール単位で段階的に．

  typecheck:
    # pyright（basic）．pyproject の [tool.pyright] が対象と設定を持つ
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ${{ env.LOCK_ARGS }} -r requirements-dev.txt
      - run: pyright --pythonpath "$(which python)"

  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # macOS は実機での確認はしていないが，サーバー側はここで検証する（1 組だけ．コスト対策）
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # lock は生成環境（Python 3.12）にだけ適用する．3.10 / 3.11 は同じ pin では解決できない
      # （osmnx 2.1 等に配布物が無い）ので範囲指定で最新を入れ，互換性の確認を兼ねる．
      - name: install (${{ matrix.python-version == '3.12' && env.LOCK_ARGS || '--upgrade' }})
        run: pip install ${{ matrix.python-version == '3.12' && env.LOCK_ARGS || '--upgrade' }} -r requirements-dev.txt
      - name: pytest
        run: pytest -ra -q

  frontend:
    # フロントの純粋ロジック（static/js/risu-core.js）を node の組み込みランナーで検証する．
    # npm の依存は無い（package.json も無い）．ブラウザ無しで走るので速い．
    name: frontend logic (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/js/*.test.js

  e2e:
    # 実ブラウザ（headless Chromium）で「読み込み → 描画 → 統計 → エディタ」の結線を確認する．
    # ロジックの検証は frontend ジョブ，ここは壊れていないことの確認だけ（数十秒）．
    name: browser smoke (Playwright / Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          pip install ${{ env.LOCK_ARGS }} -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: pytest tests/e2e
        run: pytest tests/e2e -ra -q

  licenses:
    # RISU は MIT で配布する．新しいコピーレフト依存が紛れ込んだら気づけるようにする．
    # 詳細な判断根拠は THIRD_PARTY_LICENSES.md を参照．
    name: dependency licenses (no new copyleft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ${{ env.LOCK_ARGS }} -r requirements.txt pip-licenses
      - name: GPL / LGPL / AGPL が増えていないか
        # PyQt5 / PyQt5-Qt5 は uxsim が必須依存として宣言しているもの．
        # RISU は import しない（tests の TestLicenseHygiene が検証）し再配布もしないため，
        # MIT 配布の妨げにはならない．ここでは既知の例外として除外する．
        # これ以外に GPL 系が現れたらジョブを落として判断を促す．
        run: >-
          pip-licenses --partial-match
          --ignore-packages PyQt5 PyQt5-Qt5
          --fail-on "GPL;GNU General Public License;LGPL;GNU Lesser General Public License;AGPL;GNU Affero General Public License"
      - name: 解決されたライセンス表を出力（ログ確認用）
        if: always()
        run: pip-licenses --format=markdown --with-urls --order=license

  standalone:
    # RISU サーバーを介さないパイプライン（scripts/run_scenario.py）が，
    # FastAPI も LLM も無い最小環境で動くことを確認する．
    # ここが通らないと「素の UXsim で回せる」という売り文句が嘘になる．
    name: standalone pipeline (uxsim のみ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install uxsim only
        run: pip install ${{ env.LOCK_ARGS }} "uxsim>=1.11.0,<2"
      - name: シナリオを実行
        run: |
          cat > /tmp/scenario.json <<'JSON'
          {"name": "ci_bottleneck", "tmax": 1000, "deltan": 5,
           "nodes": [{"name": "A", "x": 0, "y": 0},
                     {"name": "B", "x": 2000, "y": 0, "flow_capacity": 0.4},
                     {"name": "C", "x": 4000, "y": 0}],
           "links": [{"name": "AB", "start": "A", "end": "B", "length": 2000},
                     {"name": "BC", "start": "B", "end": "C", "length": 2000}],
           "demands": [{"orig": "A", "dest": "C", "t_start": 0, "t_end": 400, "flow": 0.6}]}
          JSON
          python scripts/run_scenario.py /tmp/scenario.json --analysis
      - name: 生成した単体スクリプトが動く
        run: |
          python scripts/run_scenario.py /tmp/scenario.json --emit /tmp/emitted.py
          python /tmp/emitted.py
