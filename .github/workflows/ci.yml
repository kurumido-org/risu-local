name: CI

on:
  push:
    branches: [main]
  pull_request:
  # RISU は uxsim の内部 API に依存した高速化を持つ（CLAUDE.md §3.6）．
  # requirements.txt は `uxsim>=1.11.0,<2` なので，新しい uxsim が出ると
  # 黙って壊れ得る．push が無くても週 1 で気づけるようにしておく．
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 00:00 UTC
  workflow_dispatch:       # 手動実行

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # lint だけなら重い依存（osmnx → geopandas/shapely）は要らない
      - run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .
      # NOTE: `ruff format` は意図的に CI へ入れていない．
      # server.py の数値処理は桁を揃えて書いてあり，自動整形すると
      # 4,000 行規模の差分が出て履歴が読めなくなるため．
      # 整形を入れるなら，まずファイル分割をしてから段階的に．

  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -ra -q

  licenses:
    # RISU は MIT で配布する．新しいコピーレフト依存が紛れ込んだら気づけるようにする．
    # 詳細な判断根拠は THIRD_PARTY_LICENSES.md を参照．
    name: dependency licenses (no new copyleft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-licenses
      - name: GPL / LGPL / AGPL が増えていないか
        # PyQt5 / PyQt5-Qt5 は uxsim が必須依存として宣言しているもの．
        # RISU は import しない（tests の TestLicenseHygiene が検証）し再配布もしないため，
        # MIT 配布の妨げにはならない．ここでは既知の例外として除外する．
        # これ以外に GPL 系が現れたらジョブを落として判断を促す．
        run: >-
          pip-licenses --partial-match
          --ignore-packages PyQt5 PyQt5-Qt5
          --fail-on "GPL;GNU General Public License;LGPL;GNU Lesser General Public License;AGPL;GNU Affero General Public License"
      - name: 解決されたライセンス表を出力（ログ確認用）
        if: always()
        run: pip-licenses --format=markdown --with-urls --order=license

  standalone:
    # RISU サーバーを介さないパイプライン（scripts/run_scenario.py）が，
    # FastAPI も LLM も無い最小環境で動くことを確認する．
    # ここが通らないと「素の UXsim で回せる」という売り文句が嘘になる．
    name: standalone pipeline (uxsim のみ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install uxsim only
        run: pip install "uxsim>=1.11.0,<2"
      - name: シナリオを実行
        run: |
          cat > /tmp/scenario.json <<'JSON'
          {"name": "ci_bottleneck", "tmax": 1000, "deltan": 5,
           "nodes": [{"name": "A", "x": 0, "y": 0},
                     {"name": "B", "x": 2000, "y": 0, "flow_capacity": 0.4},
                     {"name": "C", "x": 4000, "y": 0}],
           "links": [{"name": "AB", "start": "A", "end": "B", "length": 2000},
                     {"name": "BC", "start": "B", "end": "C", "length": 2000}],
           "demands": [{"orig": "A", "dest": "C", "t_start": 0, "t_end": 400, "flow": 0.6}]}
          JSON
          python scripts/run_scenario.py /tmp/scenario.json --analysis
      - name: 生成した単体スクリプトが動く
        run: |
          python scripts/run_scenario.py /tmp/scenario.json --emit /tmp/emitted.py
          python /tmp/emitted.py
